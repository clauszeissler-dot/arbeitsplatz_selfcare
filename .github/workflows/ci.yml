name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Kernlogik testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Explizite Notarisierungskonfiguration testen
        run: python3 -m unittest discover -s tests -p "test_notarize_configuration.py"
      - run: cargo test -p lotse-core
      - run: cargo clippy -p lotse-core --all-targets -- -D warnings

  macos:
    name: Mac-App bauen (unsigniert)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles app --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: Lotse-unsigniert
          path: target/universal-apple-darwin/release/bundle/macos/Lotse.app

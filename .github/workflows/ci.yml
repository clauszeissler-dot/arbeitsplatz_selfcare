name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Kernlogik und Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust installieren
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt
          rustup default 1.96.1
      - name: Python-Konfigurations- und Securitytests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: cargo test -p lotse-core --locked
      - run: cargo clippy -p lotse-core --all-targets --locked -- -D warnings
      - name: RustSec
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  macos:
    name: Mac-App bauen (unsigniert)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Rust installieren
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default 1.96.1
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run build
      - run: scripts/build-universal.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lotse-unsigniert
          path: target/universal-apple-darwin/release/bundle/macos/Lotse.app
          if-no-files-found: error
